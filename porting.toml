schema_version = 1

[device]
name = "elden"
soc = "SM8750P"
os_profile = "ipados-17.7.11-21H461"
summary = "Lenovo Legion Y700 Gen 4 format 2 migration. Phase 1 UEFI is device-verified; XNU, storage, display and touch remain bring-up work."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "soc/**", "configs/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = ["Use the ARM64 and iPadOS 17.7.11 profiles supplied by UniXNU.", "Select the shared platform, CPU and DarwinBoot components.", "Provide an SM8750 profile until an official shared SoC repository exists."]
configuration = ["board.toml declares schema_version = 2, soc_source = sm8750 and os_profile = ipados-17.7.11-21H461.", "The complete component list is explicit because profile arrays replace inherited arrays.", "Configuration and patch roots are ordered as ARM64, SoC, OS and device.", "soc/sm8750 supplies the transition profile and is referenced from feeds.toml."]
procedure = ["Run defconfig from a current UniXNU checkout.", "Inspect status JSON for profile order, component dependencies, patch order and output path.", "Replace the local SoC source with a reviewed UniXNU-sm8750-common commit before release."]
findings = ["The repository was format 1 and did not select shared SoC or OS profiles.", "A public UniXNU-sm8750-common repository was not available during migration.", "Keeping a separate local SoC profile preserves parser validation without mislabelling unqualified hardware support as shared.", "Phase 2.0 resolved ARM64, local SM8750, iPadOS and device layers; the selected component order, 56 patches, 4 KiB page setting and separate format 2 output were checked with current UniXNU."]
completion = ["board.toml resolves four ordered configuration layers.", "All selected components come from the UniXNU catalog and include their dependencies.", "No array field depends accidentally on inheritance.", "The SoC source is a reviewed remote commit and unixnu.lock records it."]
limits = ["soc/sm8750 is local and is not yet a release-quality shared source.", "The first resolution pass selects only platform, CPU, AES, prelink and DarwinBoot components."]
next_action = ["Phase 2.0 is complete. Proceed with the parallel Phase 2.1 hardware/memory and Phase 2.2 kernel-input work; publish and pin a reviewed SM8750 shared commit before release."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Schema 2 profile, component, kernel, device-tree and payload declarations." },
  { kind = "source", reference = "feeds.toml", result = "SM8750 transition source with the release replacement documented." },
  { kind = "source", reference = "soc/sm8750/soc.toml", result = "Shared-profile-shaped SM8750 transition metadata." },
  { kind = "source", reference = "docs/FORMAT2-MIGRATION.md", result = "Migration result, preserved phase 1 inputs and remaining release work." },
  { kind = "host", reference = "docs/PHASE2-STATUS.md", command = ".venv/bin/python .cache/phase2-plan/UniXNU/unixnu status --json -D .", revision = "16e592abee8a550dec8154ed1f38b5ebc4f16213", result = "2026-10-25: fresh defconfig, tree and status runs resolved four profiles, five pinned components, 56 patches and 4 KiB pages under a format 2 output directory separate from phase 1. The local SM8750 source remains unpinned for release." },
]

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["scripts/**", "drivers/**", "patches/overlays/**", "package/**", "proprietary-files.txt"]
inputs = ["mu_wide_platforms lenovo-y700g4 UEFI source and patched PMIC binaries.", "UniXNU, UniXNUDxe, DarwinBoot and EldenRamDiskDxe firmware modules.", "A 4 MiB FAT16 payload containing package/unixnu.toml."]
configuration = ["firmware.dsc points to PakalaPkg/PakalaNoSb.dsc.", "firmware.fd points to the DEBUG CLANGPDB SM8750_EFI.fd.", "payload volume is ELDENRAM and loader is firmware.", "panic_screen remains false because the phase 2 panic renderer is not integrated."]
procedure = ["Build the phase 1 image with scripts/build_phase1.py.", "Run scripts/verify_artifact.py against the FD and Android v3 image.", "Owner performs two RAM cold boots with fastboot boot."]
findings = ["The vendor UFSDxe crashed before the menu, so it was removed from the phase 1 APRIORI, DSC and FDF.", "The embedded FAT payload avoids persistent storage and makes the menu independent of UFS.", "The same image reached the visible menu twice and returned to stock Android after reset."]
completion = ["Firmware contains UniXNU, UniXNUDxe, DarwinBoot and the RAM payload driver.", "The payload config is readable and the menu accepts volume-key input.", "Two RAM boots produce the same visible checkpoint and do not modify persistent partitions."]
limits = ["The verified firmware is phase 1 and does not contain a bootable XNU payload.", "The new format 2 firmware command is not yet switched from the project build script."]
next_action = ["Use the current phase 1 image as the accepted baseline. Phase 2.3: validate Android ramdisk/FDT/HOB handoff and the RAM disk driver only in a separately isolated candidate; measure inner/outer FV capacity before integrating kernel inputs."]
evidence = [
  { kind = "source", reference = "docs/PHASE1-STATUS.md", result = "Accepted phase 1 artifact and firmware/module inventory." },
  { kind = "source", reference = "scripts/verify_artifact.py", result = "Static FD, Android image and embedded FAT verification." },
  { kind = "device", reference = "docs/PHASE2-STATUS.md", command = "fastboot boot out/elden-phase1.img", revision = "dffc3020a85830d0d981a85871d9ab31aac5827d", result = "2026-10-25: owner reported that the current image completed two RAM cold boots, reached the visible and operable UniXNU menu, and returned to stock Android." },
  { kind = "device", reference = "docs/PHASE1-HANDOFF.md", command = "fastboot boot out/elden-phase1.img", revision = "c591b1a0a471f24978aba25c56c8f6ec9bd06668", result = "Two owner-run RAM cold boots reached the UniXNU menu and returned to Android." },
]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["soc/sm8750/dts/**", "dts/**"]
inputs = ["SM8750 MPIDRs 0x0, 0x100, 0x200, 0x300, 0x400, 0x500, 0x10000 and 0x10100.", "GICv3 distributor 0x16000000, redistributor base 0x16080000 and stride 0x40000.", "19.2 MHz architectural timer and PSCI SMC conduit."]
configuration = ["The SoC DTSI declares eight CPU nodes, timebase-frequency = 19200000 and psci method = smc.", "The GIC node exports unixnu,adt-name = intc.", "The device defconfig enables ARM DT platform, ArmCpu, native timer and PAN."]
procedure = ["Compile dts/elden.dts with the SoC include path.", "Generate an ADT from the DTB and inspect /cpus, /psci and /arm-io/intc.", "Boot the smallest XNU payload and record the first CPU, GIC or timer failure."]
findings = ["The board evidence documents the same eight MPIDR layout used by other SM8750 ports.", "ArmCpu reads the GIC through /arm-io/intc and requires a complete two-range reg property.", "Secondary CPU startup is not device-verified for elden."]
completion = ["The boot CPU reaches the ArmCpu checkpoint.", "GIC distributor and its own redistributor frame map successfully.", "Timer and IPI handling work before secondary cores are enabled."]
limits = ["No elden XNU CPU, GIC or timer log exists yet.", "The eight-core topology is described, but SMP bring-up is not claimed."]
next_action = ["Phase 2.1: audit boot CPU identity and kernel argument semantics, including armcpu-spi-ipi. Phase 2.5: prove ArmDTPlatform and boot CPU ArmCpu/GIC/timer checkpoints; defer secondary startup and IPI/SMP qualification."]
evidence = [
  { kind = "source", reference = "soc/sm8750/dts/sm8750.dtsi", result = "SM8750 CPU, PSCI, GICv3 and timer resources." },
  { kind = "source", reference = "docs/PHASE2-HANDOFF.md", result = "Board CPU/GIC/timebase inventory and planned diagnostic sequence." },
]

[[area]]
id = "memory"
status = "implemented"
components = ["ArmDTPlatform"]
paths = ["dts/**", "soc/sm8750/dts/**"]
inputs = ["DRAM base 0x80000000.", "A conservative contiguous 2 GiB handoff window.", "The memory map remains fragmented above the low window."]
configuration = ["dts/elden.dts declares one memory node at 0x80000000 with size 0x80000000.", "payload.dram_size matches that node.", "The format 2 generator creates the CHRP NVRAM proxy and DarwinBoot memory placeholders."]
procedure = ["Compile the hardware DTB.", "Run the shared ADT generator with a nonzero test seed.", "Inspect chosen.dram-base, chosen.dram-size and /chosen/memory-map."]
findings = ["The iPadOS kernel input used by the reference port is qualified with a 2 GiB low DRAM window.", "The full device memory map is fragmented and must not be represented as one whole-device range.", "The unique chip ID remains a local input and is not stored in the repository."]
completion = ["The ADT contains exactly one continuous memory range.", "DarwinBoot allocates its handoff at the requested range.", "The live map is reconciled with every reserved and MMIO region."]
limits = ["Only the low 2 GiB window is described.", "Reserved-memory ownership, SMMU and cache policy are not complete."]
next_action = ["Phase 2.1: collect the live FDT and reservations before any XNU handoff. Audit FD, shim, decompression, initrd, GOP, kernel, ADT and boot_args intervals; the declared low 2 GiB range is a candidate, not proof of free memory."]
evidence = [
  { kind = "source", reference = "dts/elden.dts", result = "Contiguous low DRAM range and board compatible values." },
  { kind = "source", reference = "docs/porting-analysis.md", result = "Documented DRAM base, fragmentation risk and memory handoff constraints." },
]

