version = 1

[boot]
timeout = -1
fallback_timeout = 600
default = "reset"

[kits]
autoload = false

[ui]
scale = 4

[[entry]]
id = "xnu"
title = "ELDEN UFS READ CHECK - LUN4"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v serial=3 debug=0x14e armcpu-diagnostics=1 -no_slto_panic security-mode-change-enable=1 amfi_get_out_of_my_way=1 elden-gop-console=1 -enable_kprintf_spam native-ufs-probe=10 native-ufs-lun=4 native-ufs-diagnostics=1"

[[entry]]
id = "inspect"
title = "UFS registers - read only"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v serial=3 debug=0x14e -no_slto_panic security-mode-change-enable=1 amfi_get_out_of_my_way=1 elden-gop-console=1 -enable_kprintf_spam native-ufs-probe=2 native-ufs-lun=4 native-ufs-diagnostics=1"

[[entry]]
id = "smmu"
title = "SMMU route - read only"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v serial=3 debug=0x14e -no_slto_panic security-mode-change-enable=1 amfi_get_out_of_my_way=1 elden-gop-console=1 -enable_kprintf_spam native-ufs-probe=7 native-ufs-lun=4 native-ufs-diagnostics=1"

[[entry]]
id = "banks"
title = "SMMU banks - read only"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v serial=3 debug=0x14e -no_slto_panic security-mode-change-enable=1 amfi_get_out_of_my_way=1 elden-gop-console=1 -enable_kprintf_spam native-ufs-probe=8 native-ufs-lun=4 native-ufs-diagnostics=1"

[[entry]]
id = "kernel"
title = "XNU - wait for root device"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v serial=3 debug=0x14e -no_slto_panic security-mode-change-enable=1 amfi_get_out_of_my_way=1 elden-gop-console=1 -enable_kprintf_spam"

[[entry]]
id = "reset"
title = "Restart"
type = "action"
action = "reset"

[[entry]]
id = "shutdown"
title = "Power off"
type = "action"
action = "shutdown"
