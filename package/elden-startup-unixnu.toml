version = 1
[boot]
timeout = 120
fallback_timeout = 120
default = "shutdown"
[kits]
autoload = false
[ui]
scale = 4
[[entry]]
id = "xnu"
title = "iPadOS startup + USB - TEST"
type = "xnu"
path = "Payloads/kernel.macho"
initrd = "Payloads/data.packed"
args = "-v serial=3 debug=0x14e armcpu-diagnostics=1 -no_slto_panic security-mode-change-enable=1 amfi_get_out_of_my_way=1 elden-gop-console=1 -enable_kprintf_spam native-ufs-root=1 native-ufs-lun=0 native-ufs-diagnostics=1 elden-usb-debug=1 elden-usb-required=1 rd=uuid boot-uuid=04769D26-2CA0-4825-B443-E2E5F88300F2"
[[entry]]
id = "usb"
title = "USB logs only - wait for root"
type = "xnu"
path = "Payloads/kernel.macho"
initrd = "Payloads/data.packed"
args = "-v serial=3 debug=0x14e -no_slto_panic security-mode-change-enable=1 amfi_get_out_of_my_way=1 elden-gop-console=1 -enable_kprintf_spam elden-usb-debug=1 elden-usb-required=1 rd=uuid boot-uuid=04769D26-2CA0-4825-B443-E2E5F88300F2"
[[entry]]
id = "root"
title = "iPadOS startup - USB disabled"
type = "xnu"
path = "Payloads/kernel.macho"
initrd = "Payloads/data.packed"
args = "-v serial=3 debug=0x14e -no_slto_panic security-mode-change-enable=1 amfi_get_out_of_my_way=1 elden-gop-console=1 -enable_kprintf_spam native-ufs-root=1 native-ufs-lun=0 native-ufs-diagnostics=1 rd=uuid boot-uuid=04769D26-2CA0-4825-B443-E2E5F88300F2"
[[entry]]
id = "probe"
title = "UFS manifest check - read only"
type = "xnu"
path = "Payloads/kernel.macho"
initrd = "Payloads/data.packed"
args = "-v serial=3 debug=0x14e -no_slto_panic security-mode-change-enable=1 amfi_get_out_of_my_way=1 elden-gop-console=1 -enable_kprintf_spam native-ufs-probe=10 native-ufs-lun=0 native-ufs-diagnostics=1 rd=uuid boot-uuid=04769D26-2CA0-4825-B443-E2E5F88300F2"
[[entry]]
id = "memory"
title = "Available memory - read only"
type = "efi"
path = "EldenPayloadLoader.efi"
args = "memory"
[[entry]]
id = "reset"
title = "Restart"
type = "action"
action = "reset"
[[entry]]
id = "shutdown"
title = "Power off"
type = "action"
action = "shutdown"
